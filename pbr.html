<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PBR Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0f;--sf:#141416;--pn:#1a1a1e;--bd:#2a2a30;--ac:#7c6aff;--ac2:#00e5c0;--tx:#e8e8f0;--mu:#7b7b8a;--lb:#a0a0b0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f3f3f6;--sf:#fff;--pn:#f7f7fa;--bd:#dcdce4;--ac:#5b47f0;--ac2:#00846e;--tx:#1a1a22;--mu:#777788;--lb:#55556a}}
:root[data-theme=light]{--bg:#f3f3f6;--sf:#fff;--pn:#f7f7fa;--bd:#dcdce4;--ac:#5b47f0;--ac2:#00846e;--tx:#1a1a22;--mu:#777788;--lb:#55556a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:13px/1.4 Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column}
[hidden]{display:none!important}
header{display:flex;align-items:center;gap:10px;padding:10px 18px;background:var(--sf);border-bottom:1px solid var(--bd)}
.logo{font:600 14px 'IBM Plex Mono',monospace;color:var(--ac)}.logo b{color:var(--ac2)}
.st{display:flex;align-items:center;gap:7px;color:var(--mu);font:12px 'IBM Plex Mono',monospace;margin-right:auto}
#dot{width:7px;height:7px;border-radius:50%;background:var(--mu)}#dot.ok{background:var(--ac2);box-shadow:0 0 6px var(--ac2)}
.app{flex:1;min-height:0;display:grid;grid-template-columns:320px 1fr}
aside{background:var(--sf);border-right:1px solid var(--bd);overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.up{display:block;position:relative;border:1.5px dashed var(--bd);border-radius:8px;padding:16px;text-align:center;color:var(--mu);font-size:12px;cursor:pointer}
.up:hover,.up.hot{border-color:var(--ac);background:rgba(124,106,255,.07)}
.up input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.up b{display:block;color:var(--lb);font-weight:500;margin-bottom:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
details{background:var(--pn);border:1px solid var(--bd);border-radius:9px;padding:0 12px}
details[open]{padding-bottom:5px}
summary{cursor:pointer;padding:9px 0;font-weight:600;font-size:12px;color:var(--lb)}
.c,.t{display:flex;margin-bottom:9px}.c{flex-direction:column;gap:4px}
.c span,.t span{display:flex;justify-content:space-between;font-size:11px;color:var(--lb)}
.c b{font:400 11px 'IBM Plex Mono',monospace;color:var(--ac)}
.t{justify-content:space-between;align-items:center;position:relative}
.t input{position:absolute;opacity:0;right:0;width:34px;height:19px;cursor:pointer;z-index:1}
.t i{width:34px;height:19px;border-radius:19px;background:var(--bd);position:relative;transition:.2s}
.t i::after{content:'';position:absolute;top:3px;left:3px;width:13px;height:13px;border-radius:50%;background:#fff;transition:.2s}
.t input:checked+i{background:var(--ac)}.t input:checked+i::after{transform:translateX(15px)}
input:focus-visible+i,input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--ac)}
select{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:5px 7px;font:12px Inter,sans-serif}
.b{border:0;border-radius:7px;padding:8px 13px;font:500 12px Inter,sans-serif;cursor:pointer}
.p{background:var(--ac);color:#fff}.p:hover{opacity:.9}
.g{background:transparent;border:1px solid var(--bd);color:var(--lb)}.g:hover{border-color:var(--ac);color:var(--ac)}
.s{padding:3px 9px}
.tabs{display:flex;background:var(--sf);border-bottom:1px solid var(--bd);padding:0 14px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:11px 14px;color:var(--mu);font:500 12px Inter,sans-serif;cursor:pointer}
.tab.on{color:var(--tx);border-color:var(--ac)}
.pg{display:none;flex:1;min-height:0}.pg.on{display:flex}
#grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1px;background:var(--bd);align-content:start}
.card{background:var(--pn);display:flex;flex-direction:column}
.card.big{grid-column:span 2;grid-row:span 2}
figcaption{display:flex;align-items:center;gap:8px;padding:8px 10px;font:600 11px 'IBM Plex Mono',monospace;color:var(--lb)}
figcaption em{margin-left:auto;font-weight:400;color:var(--mu);font-style:normal}
.cw{aspect-ratio:1;background:#0a0a0c;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cw canvas{max-width:100%;max-height:100%;cursor:zoom-in}
#stage{position:relative;flex:1;min-height:360px}
#three{position:absolute;inset:0;width:100%;height:100%;background:#08080a}
#pv{position:absolute;top:10px;right:10px;width:230px;max-height:calc(100% - 20px);overflow:auto;border-radius:9px}
#pv details{border-color:var(--bd)}
.nt{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--pn);border:1px solid var(--bd);border-left:3px solid var(--ac2);padding:9px 14px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.nt.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:800px){html,body{height:auto;min-height:100%}.app{display:block}aside{border:0;border-bottom:1px solid var(--bd)}#stage{min-height:75vh}#pv{top:auto;bottom:10px;left:10px;right:10px;width:auto;max-height:45%}}
</style></head>
<body>
<header>
  <div class="logo">PBR<b>.studio</b></div>
  <div class="st"><i id="dot"></i><span id="stt">memuat…</span></div>
  <button class="b g" onclick="sample()">Gambar contoh</button>
  <button class="b p" onclick="zip()">Ekspor ZIP</button>
</header>
<div class="app">
<aside>
  <label class="up" id="up"><input type="file" id="file" accept="image/*" multiple><b>Klik, seret, atau tempel (Ctrl+V)</b>Gambar sumber untuk auto-generate. Banyak file boleh: nama berisi normal, rough, metal, ao, atau height langsung masuk ke slotnya.</label>
  <div class="chips" id="chips"></div>
  <div id="ctrls"></div>
  <details><summary>Model &amp; environment</summary>
    <label class="up" style="margin-bottom:9px"><input type="file" id="mf" accept=".obj,.gltf,.glb">OBJ, GLB, GLTF. Tanpa model, dipakai bentuk bawaan.</label>
    <label class="up" style="margin-bottom:9px"><input type="file" id="ef" accept="image/*,.hdr">Environment equirect: HDR, JPG, PNG</label>
    <label class="up" style="margin-bottom:9px"><input type="file" id="cf" accept="image/*" multiple>Cubemap: pilih 6 gambar (px nx py ny pz nz)</label>
  </details>
</aside>
<main>
  <nav class="tabs"><button class="tab on" data-t="maps">Peta</button><button class="tab" data-t="prev">Pratinjau 3D</button></nav>
  <section id="maps" class="pg on"><div id="grid"></div></section>
  <section id="prev" class="pg"><div id="stage"><canvas id="three"></canvas><div id="pv"></div></div></section>
</main>
</div>
<div class="nt" id="nt"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
const $=s=>document.querySelector(s),clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const MAPS=[['albedo','Albedo'],['normal','Normal'],['rough','Roughness'],['metal','Metalness'],['ao','AO'],['height','Height'],['orm','ORM (R=AO G=Rough B=Metal)']];
// r=slider [t,id,label,min,max,step,val]  t=toggle [t,id,label,val]  s=select [t,id,label,options,val]
const GROUPS=[
['Gambar',[['s','res','Resolusi maks.',[[512,'512 px'],[1024,'1024 px'],[2048,'2048 px'],[4096,'4096 px']],1024],['t','wrap','Tileable (seamless)',1]]],
['Grayscale → Height (sumber normal)',[['s','hsrc','Sumber',[['albedo','Gambar sumber'],['height','Peta height kustom (jika ada)']],'albedo'],['s','gm','Konversi grayscale',[['lum','Luminance Rec.709'],['l601','Luminance Rec.601'],['avg','Rata-rata RGB'],['r','Channel R'],['g','Channel G'],['b','Channel B'],['max','Maks RGB (HSV value)'],['min','Min RGB'],['sat','Saturasi']],'lum'],['r','blur','Blur awal',0,20,1,0],['t','hauto','Auto-levels',0],['r','hbp','Titik hitam',0,.95,.01,0],['r','hwp','Titik putih',.05,1,.01,1],['r','hg','Gamma',.3,3,.05,1],['r','hc','Kontras',.2,4,.05,1],['r','hb','Kecerahan',-.5,.5,.01,0],['t','invH','Balik height',0]]],
['Normal',[['r','str','Kekuatan',.1,20,.1,4],['s','nk','Kernel',[['sobel','Sobel 3×3'],['scharr','Scharr (lebih akurat)'],['cen','Central diff (tajam)']],'sobel'],['r','nlg','Bentuk besar',0,3,.05,1],['r','nd','Detail halus',0,3,.05,1],['s','fmt','Format',[['gl','OpenGL (Y+)'],['dx','DirectX (Y−)']],'gl']]],
['Ambient Occlusion',[['r','aor','Radius',1,40,1,10],['r','aoi','Intensitas',0,3,.05,1]]],
['Roughness',[['r','rb','Kecerahan',-.5,.5,.01,0],['r','rc','Kontras',.2,3,.05,1],['r','rg','Gamma',.3,3,.05,1],['t','rinv','Balik roughness',0]]],
['Metalness',[['t','mon','Aktifkan',0],['r','mt','Ambang',0,1,.01,.5],['r','ms','Kelembutan',0,.5,.01,.05]]]];
const PV=[['s','view','Tampilan',[['lit','PBR penuh'],['clay','Clay (tanpa albedo)'],['albedo','Albedo'],['normal','Normal'],['rough','Roughness'],['metal','Metalness'],['ao','AO'],['height','Height']],'lit'],
['s','shape','Bentuk',[['plane','Bidang tegak (dinding)'],['floor','Bidang datar (lantai)'],['sphere','Bola'],['cube','Kubus'],['ref','Bola kalibrasi']],'sphere'],
['s','env','Environment (IBL)',[['studio','Studio'],['sky','Langit'],['grid','Grid refleksi'],['furnace','Furnace putih']],'studio'],
['r','ei','Intensitas IBL',0,4,.05,1],['t','refl','Refleksi lantai (planar)',1],['r','rs','Kekuatan refleksi',0,2,.05,1],['t','bg','Tampilkan latar',1],
['s','tone','Tone mapping',[['aces','ACES'],['none','Linear (tanpa)'],['reinhard','Reinhard'],['cineon','Cineon']],'aces'],['r','exp','Exposure',.2,3,.05,1],
['t','umap','Pakai peta rough/metal/AO',1],['t','ovr','Roughness: pakai slider (abaikan peta)',0],['t','ovm','Metalness: pakai slider (abaikan peta)',0],['r','pm','Metalness ×',0,1,.01,1],['r','pr','Roughness ×',0,1,.01,1],['r','pn','Normal',0,3,.05,1],['r','pa','AO',0,2,.05,1],['r','pd','Displacement',0,.3,.005,.05],['r','pt','Tiling',1,8,1,1],['r','pli','Lampu langsung',0,6,.1,1],['r','pl','Arah lampu',0,360,1,45],['t','wire','Wireframe',0],['t','rot','Putar otomatis',0]];
const PRE={
 Batu:{str:5,hc:1.3,aor:12,aoi:1.2,rc:1.2,rb:.1,mon:0},
 Logam:{str:2,blur:0,hc:1,aor:6,aoi:.8,rc:1.6,rb:-.1,rinv:1,mon:1,mt:.5,ms:.15},
 Kayu:{str:3,blur:1,hc:1.5,aor:8,aoi:1,rc:.9,rb:.2,mon:0},
 Kain:{str:6,hc:1.8,aor:4,aoi:.6,rc:.6,rb:.4,mon:0},
 Reset:{}};
const P={},DEF={},cv={};let src=null,T=null,MODEL=null,CUSTOM=null,tabP=false,raf,tm;

function ctl(it){const[t,id,lb,a,b,c,d]=it;
 if(t=='r'){DEF[id]=d;return`<label class=c><span>${lb}<b id=v_${id}></b></span><input type=range id=${id} min=${a} max=${b} step=${c} value=${d}></label>`}
 if(t=='t'){DEF[id]=a;return`<label class=t><span>${lb}</span><input type=checkbox id=${id}><i></i></label>`}
 DEF[id]=b;return`<label class=c><span>${lb}</span><select id=${id}>${a.map(o=>`<option value=${o[0]}>${o[1]}</option>`).join('')}</select></label>`}
$('#ctrls').innerHTML=GROUPS.map(([n,it])=>`<details open><summary>${n}</summary>${it.map(ctl).join('')}</details>`).join('');
const DM={...DEF};delete DM.res;delete DM.wrap;
$('#pv').innerHTML=`<details open><summary>Pratinjau 3D</summary>${PV.map(ctl).join('')}</details>`;
const PVIDS=new Set(PV.map(x=>x[1]));
function rd(el){P[el.id]=el.type=='checkbox'?el.checked:(isNaN(el.value)?el.value:+el.value);const v=$('#v_'+el.id);if(v)v.textContent=(+el.value).toFixed((el.step.split('.')[1]||'').length)}
function setAll(o){for(const k in o){const el=$('#'+k);if(!el)continue;el.type=='checkbox'?el.checked=!!o[k]:el.value=o[k];rd(el)}}
setAll(DEF);
document.addEventListener('input',e=>{const el=e.target;if(!el.id||!(el.id in P))return;rd(el);PVIDS.has(el.id)?applyMat():sched()});
$('#chips').innerHTML=Object.keys(PRE).map(n=>`<button class="b g s" data-p="${n}">${n}</button>`).join('')+'<button class="b g s" data-p="Cermin" title="Roughness 0, Metalness 1, abaikan peta">Tes cermin</button>';
$('#chips').onclick=e=>{const n=e.target.dataset.p;if(n=='Cermin'){setAll({ovr:1,ovm:1,pr:0,pm:1,rs:1,refl:1});applyMat();notify('Roughness 0, Metalness 1 (dari slider)')}else if(n){setAll({...DM,...PRE[n]});run()}};

$('#grid').innerHTML=MAPS.map(([k,l])=>`<figure class=card id=c_${k} hidden><figcaption><span>${l}</span><em id=d_${k}></em>${k=='orm'?'':`<label class="b g s" title="Unggah peta sendiri">↑<input type=file accept="image/*" hidden onchange="ov('${k}',this.files[0]);this.value=''"></label><button class="b g s" id=r_${k} hidden onclick="ov('${k}')" title="Kembali ke hasil auto">⟲</button>`}<button class="b g s" onclick="dl('${k}')" title="Unduh PNG">↓</button></figcaption><div class=cw><canvas id=cv_${k}></canvas></div></figure>`).join('');
MAPS.forEach(([k])=>{cv[k]=$('#cv_'+k);cv[k].onclick=()=>cv[k].closest('.card').classList.toggle('big')});

// ── input gambar ──
function load(f){if(!f||!f.type.startsWith('image/'))return;const im=new Image();im.onload=()=>setSrc(im);im.onerror=()=>notify('Gambar tidak bisa dibaca');im.src=URL.createObjectURL(f)}
function setSrc(im){src=im;run()}
const OV={},KEYS=[['normal',/norm|nrm/i],['rough',/rough|rgh/i],['metal',/metal|mtl/i],['ao',/(^|[^a-z])ao([^a-z]|$)|occlusion/i],['height',/height|disp|bump/i]];
function ov(k,f){if(!f){delete OV[k];return run()}const im=new Image();im.onload=()=>{OV[k]=im;sched()};im.onerror=()=>notify('Gambar tidak bisa dibaca');im.src=URL.createObjectURL(f)}
function loadFiles(fs){fs=[...fs].filter(f=>f.type.startsWith('image/'));let n=0;for(const f of fs){const nm=f.name.replace(/\.[^.]+$/,''),h=KEYS.find(x=>x[1].test(nm));if(h){ov(h[0],f);n++}else load(f)}n&&notify(n+' peta kustom dimuat')}
$('#file').onchange=e=>loadFiles(e.target.files);
addEventListener('dragover',e=>{e.preventDefault();$('#up').classList.add('hot')});
addEventListener('dragleave',e=>{if(!e.relatedTarget)$('#up').classList.remove('hot')});
addEventListener('drop',e=>{e.preventDefault();$('#up').classList.remove('hot');loadFiles(e.dataTransfer.files)});
addEventListener('paste',e=>{const f=[...(e.clipboardData?.files||[])].find(f=>f.type.startsWith('image/'));f&&load(f)});

// ── gambar contoh: dinding bata seamless ──
function sample(){const S=512,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d'),im=x.createImageData(S,S);
 const hs=(i,j,p)=>{let h=(((i%p+p)%p)*374761393+((j%p+p)%p)*668265263)^0x5bd1e995;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967295};
 const sm=t=>t*t*(3-2*t),vn=(x,y,p)=>{const i=Math.floor(x),j=Math.floor(y),fx=sm(x-i),fy=sm(y-j),a=hs(i,j,p),b=hs(i+1,j,p),c=hs(i,j+1,p),d=hs(i+1,j+1,p);return a+(b-a)*fx+(c-a+(a-b-c+d)*fx)*fy};
 for(let y=0;y<S;y++)for(let X=0;X<S;X++){const u=X/S,v=y/S,nz=.5*vn(u*4,v*4,4)+.25*vn(u*8,v*8,8)+.15*vn(u*16,v*16,16)+.1*vn(u*32,v*32,32);
  const row=Math.floor(y/64),sx=X+(row%2)*64,xo=sx%128,yo=y%64,k=(y*S+X)*4;let r,g,b;
  if(xo<6||yo<6){const m=.35+nz*.4;r=m*.8;g=m*.78;b=m*.72}
  else{const t=hs(Math.floor(sx/128)%4,row,8),e=Math.min(1,(Math.min(xo-6,yo-6,127-xo,63-yo)+1)/7),m=(.45+t*.3+nz*.5)*(.7+.3*e);r=m*.95;g=m*.5;b=m*.38}
  im.data[k]=clamp(r)*255;im.data[k+1]=clamp(g)*255;im.data[k+2]=clamp(b)*255;im.data[k+3]=255}
 x.putImageData(im,0,0);setSrc(c)}

// ── pemrosesan ──
function pass(s,d,n,ln,st,ls,r,wr){const k=2*r+1,at=(b,i)=>s[b+(wr?((i%n)+n)%n:i<0?0:i>=n?n-1:i)*st];
 for(let l=0;l<ln;l++){const b=l*ls;let sum=0;for(let i=-r;i<=r;i++)sum+=at(b,i);for(let i=0;i<n;i++){d[b+i*st]=sum/k;sum+=at(b,i+r+1)-at(b,i-r)}}}
function blur(a,w,h,r,wr){if(!r)return a.slice();let t=a;const o=new Float32Array(a.length),u=new Float32Array(a.length);
 for(let i=0;i<2;i++){pass(t,o,w,h,1,w,r,wr);pass(o,u,h,w,w,1,r,wr);t=u}return u}
const g3=(I,k,v)=>{I.data[k]=I.data[k+1]=I.data[k+2]=v*255;I.data[k+3]=255};
function gd(im,w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0,w,h);return x.getImageData(0,0,w,h).data}
function sched(){clearTimeout(tm);tm=setTimeout(run,90)}
function run(){if(!src)return;const t0=performance.now();
 const b=Object.values(OV)[0]||src,m=Math.min(1,P.res/Math.max(b.width,b.height)),w=Math.round(b.width*m),h=Math.round(b.height*m),n=w*h;
 for(const[k]of MAPS){cv[k].width=w;cv[k].height=h}
 const tc=document.createElement('canvas');tc.width=w;tc.height=h;const tx=tc.getContext('2d');tx.drawImage(src,0,0,w,h);const d=tx.getImageData(0,0,w,h).data;cv.albedo.getContext('2d').drawImage(OV.albedo||src,0,0,w,h);
 const L=new Float32Array(n);for(let i=0;i<n;i++)L[i]=(.2126*d[i*4]+.7152*d[i*4+1]+.0722*d[i*4+2])/255;
 const hd=P.hsrc=='height'&&OV.height?gd(OV.height,w,h):d,G=new Float32Array(n),gm=P.gm;
 for(let i=0;i<n;i++){const k=i*4,r=hd[k]/255,g=hd[k+1]/255,b=hd[k+2]/255;
  G[i]=gm=='r'?r:gm=='g'?g:gm=='b'?b:gm=='avg'?(r+g+b)/3:gm=='l601'?.299*r+.587*g+.114*b:gm=='max'?Math.max(r,g,b):gm=='min'?Math.min(r,g,b):gm=='sat'?Math.max(r,g,b)-Math.min(r,g,b):.2126*r+.7152*g+.0722*b}
 const H=blur(G,w,h,P.blur,P.wrap);let lo=0,hi=1;
 if(P.hauto){lo=1;hi=0;for(let i=0;i<n;i++){const v=H[i];if(v<lo)lo=v;if(v>hi)hi=v}}
 const rg=Math.max(hi-lo,1e-4),lw=Math.max(P.hwp-P.hbp,.01),ih=1/P.hg;
 for(let i=0;i<n;i++){let v=clamp((clamp((H[i]-lo)/rg)-P.hbp)/lw);v=clamp((Math.pow(v,ih)-.5)*P.hc+.5+P.hb);H[i]=P.invH?1-v:v}
 const B=blur(H,w,h,P.aor,P.wrap),mk=()=>new ImageData(w,h),N=mk(),R=mk(),M=mk(),A=mk(),Hh=mk(),O=mk();

 const[wo,wc,nm]={sobel:[1,2,1],scharr:[3,10,.25],cen:[0,1,4]}[P.nk],s=P.str*nm*w/1024,sg=P.fmt=='dx'?-1:1,wr=P.wrap;

 for(const k in OV)if(k!='albedo')cv[k].getContext('2d').drawImage(OV[k],0,0,w,h);
 const px=k=>cv[k].getContext('2d').getImageData(0,0,w,h).data,a_=px('ao'),r_=px('rough'),m_=px('metal');
 for(let i=0;i<n*4;i+=4){O.data[i]=a_[i];O.data[i+1]=r_[i];O.data[i+2]=m_[i];O.data[i+3]=255}
 cv.orm.getContext('2d').putImageData(O,0,0);
 MAPS.forEach(([k])=>{$('#c_'+k).hidden=false;$('#d_'+k).textContent=w+'×'+h+(OV[k]?' · kustom':'');const r=$('#r_'+k);if(r)r.hidden=!OV[k]});
 $('#dot').className='ok';$('#stt').textContent=`${w}×${h} · ${Math.round(performance.now()-t0)} ms`;
 if(T){allTex().forEach(t=>t.needsUpdate=true);applyMat()}

// ── pratinjau 3D ──
function initThree(){if(T)return;const c=$('#three'),r=new THREE.WebGLRenderer({canvas:c,antialias:true});
 r.outputEncoding=THREE.sRGBEncoding;r.toneMapping=THREE.ACESFilmicToneMapping;r.setPixelRatio(Math.min(devicePixelRatio,2));
 const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,1,.01,100);cam.position.set(0,.3,3.4);
 const ctl=new THREE.OrbitControls(cam,c);ctl.enableDamping=true;
 const L=new THREE.DirectionalLight(0xffffff,2);sc.add(L);
 const tex={};for(const k of['albedo','normal','orm','height']){const t=tex[k]=new THREE.CanvasTexture(cv[k]);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8}
 tex.albedo.encoding=THREE.sRGBEncoding;
 const mat=new THREE.MeshStandardMaterial({map:tex.albedo,normalMap:tex.normal,roughnessMap:tex.orm,metalnessMap:tex.orm,aoMap:tex.orm,displacementMap:tex.height,side:THREE.DoubleSide});
 T={r,sc,cam,ctl,L,tex,mat,mesh:null,shape:null,prop:null,vc:new THREE.PerspectiveCamera(),tm:new THREE.Matrix4(),rt2:new THREE.WebGLRenderTarget(1024,1024),dt:{},bgc:new THREE.Color(0x08080a),dbg:new THREE.MeshBasicMaterial({side:THREE.DoubleSide,toneMapped:false})};mat.onBeforeCompile=patch;new ResizeObserver(fit).observe($('#stage'))}
function fit(){const s=$('#stage');if(!T||!s.clientWidth)return;T.r.setSize(s.clientWidth,s.clientHeight,false);T.cam.aspect=s.clientWidth/s.clientHeight;T.cam.updateProjectionMatrix()}
function geo(){const s=P.shape;const g=s=='plane'?new THREE.PlaneGeometry(2,2,256,256):s=='floor'?new THREE.PlaneGeometry(4,4,300,300):s=='sphere'?new THREE.SphereGeometry(1,160,120):s=='cube'?new THREE.BoxGeometry(1.5,1.5,1.5,80,80,80):MODEL.clone();
 if(!g.attributes.normal)g.computeVertexNormals();if(g.attributes.uv)g.setAttribute('uv2',g.attributes.uv);return g}
const allTex=()=>Object.values(T.tex).concat(Object.values(T.dt));
const mkDbg=k=>{const t=new THREE.CanvasTexture(cv[k]);t.encoding=THREE.sRGBEncoding;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;return t};
function refGroup(){const g=new THREE.Group(),sp=new THREE.SphereGeometry(.42,48,32);
 for(let j=0;j<2;j++)for(let i=0;i<5;i++){const s=new THREE.Mesh(sp,new THREE.MeshStandardMaterial({color:j?0xffc978:0xdddddd,metalness:j,roughness:i/4}));s.position.set(i-2,.5-j,0);g.add(s)}return g}
function applyMat(){if(!T)return;const m=T.mat,v=P.view,lit=v=='lit'||v=='clay';
 if(T.shape!==P.shape){T.shape=P.shape;if(T.mesh){T.sc.remove(T.mesh);T.mesh.traverse(c=>c.geometry&&c.geometry.dispose())}
  T.mesh=P.shape=='ref'?refGroup():new THREE.Mesh(geo(),m);const fl=P.shape=='floor';if(fl)T.mesh.rotation.x=-Math.PI/2;T.sc.add(T.mesh);
  if(T.prop){T.sc.remove(T.prop);T.prop.geometry.dispose();T.prop.material.dispose();T.prop=null}
  if(fl){T.prop=new THREE.Mesh(new THREE.SphereGeometry(.4,64,48),new THREE.MeshStandardMaterial({color:0xe8a15a,metalness:.1,roughness:.3}));T.prop.position.set(0,.4,0);T.sc.add(T.prop)}
  T.cam.position.set(...({ref:[0,.3,7],floor:[0,1.5,3.8]}[P.shape]||[0,.3,3.4]));T.ctl.target.set(0,fl?.2:0,0);T.ctl.maxPolarAngle=fl?Math.PI/2-.05:Math.PI}
 if(T.envKey!==P.env){T.envKey=P.env;buildEnv()}
 T.sc.background=P.bg?T.rt.texture:T.bgc;
 T.r.toneMapping={aces:THREE.ACESFilmicToneMapping,none:THREE.NoToneMapping,reinhard:THREE.ReinhardToneMapping,cineon:THREE.CineonToneMapping}[P.tone];T.r.toneMappingExposure=P.exp;
 m.map=v=='clay'?null:T.tex.albedo;m.aoMap=P.umap?T.tex.orm:null;m.roughnessMap=P.umap&&!P.ovr?T.tex.orm:null;m.metalnessMap=P.umap&&!P.ovm?T.tex.orm:null;

// ── refleksi planar (lantai): kekuatan dari metalness, roughness, fresnel ──
function patch(sh){sh.uniforms.tR={value:T.rt2.texture};sh.uniforms.tM={value:T.tm};sh.uniforms.uK={value:0};T.u=sh.uniforms;

// ── environment / IBL ──
function envTex(n){const W=1024,H=512,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
 const lin=st=>{const g=x.createLinearGradient(0,0,0,H);st.forEach(([o,k])=>g.addColorStop(o,k));x.fillStyle=g;x.fillRect(0,0,W,H)};
 if(n=='furnace'){x.fillStyle='#fff';x.fillRect(0,0,W,H)}
 else if(n=='sky'){lin([[0,'#2f64b0'],[.49,'#bcd8f2'],[.5,'#6a6055'],[1,'#2a2622']]);const g=x.createRadialGradient(700,130,0,700,130,70);g.addColorStop(0,'#fff');g.addColorStop(.3,'#fff');g.addColorStop(1,'rgba(255,240,200,0)');x.fillStyle=g;x.fillRect(0,0,W,H)}
 else if(n=='studio'){lin([[0,'#6a6a78'],[.5,'#9a9aa6'],[1,'#34343a']]);x.filter='blur(14px)';x.fillStyle='#fff';x.fillRect(140,110,170,140);x.fillStyle='#d8e4ff';x.fillRect(620,90,60,200);x.fillStyle='#ffe2c4';x.fillRect(830,150,150,90);x.filter='none'}

function buildEnv(){const t=P.env=='custom'?CUSTOM:envTex(P.env),pm=T.pm||(T.pm=new THREE.PMREMGenerator(T.r)),rt=t.isCubeTexture?pm.fromCubemap(t):pm.fromEquirectangular(t);

function useCustom(name){const s=$('#env');let o=s.querySelector('option[value=custom]');if(!o){o=new Option('','custom');s.add(o)}
 o.textContent='Kustom: '+name;s.value='custom';rd(s);if(T)T.envKey=null;applyMat();notify('Environment dimuat. Buka tab Pratinjau 3D')}
$('#ef').onchange=e=>{const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f),fail=()=>notify('Environment gagal dimuat'),ok=t=>{t.mapping=THREE.EquirectangularReflectionMapping;CUSTOM=t;useCustom(f.name)};
 if(/\.hdr$/i.test(f.name))new THREE.RGBELoader().setDataType(THREE.UnsignedByteType).load(url,ok,null,fail);
 else new THREE.TextureLoader().load(url,t=>{t.encoding=THREE.sRGBEncoding;ok(t)},null,fail)};
$('#cf').onchange=async e=>{let fs=[...e.target.files];if(fs.length!=6)return notify('Pilih tepat 6 gambar: px nx py ny pz nz');
 const key=[/px|posx|right/i,/nx|negx|left/i,/py|posy|top/i,/ny|negy|bottom/i,/pz|posz|front/i,/nz|negz|back/i],o=key.map(r=>fs.find(f=>r.test(f.name)));

 try{const ims=await Promise.all(fs.map(f=>new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=URL.createObjectURL(f)})));
  if(new Set(ims.map(i=>i.width+'x'+i.height)).size>1||ims[0].width!=ims[0].height)return notify('Keenam sisi harus persegi dan berukuran sama');
  const t=new THREE.CubeTexture(ims);t.encoding=THREE.sRGBEncoding;t.needsUpdate=true;CUSTOM=t;useCustom('cubemap')}catch(x){notify('Cubemap gagal dimuat')}};

$('#mf').onchange=e=>{const f=e.target.files[0];if(!f)return;const ext=f.name.split('.').pop().toLowerCase(),url=URL.createObjectURL(f),fail=()=>notify('Gagal memuat model');
